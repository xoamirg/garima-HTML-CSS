<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Table</title>
<link rel="stylesheet" href="stlyle.css">

</head>
<body>

<table>
<!-- Title -->
<tr>
<th colspan="6" class="title">Time Table</th>
</tr>

<!-- Days row -->
<tr>
<th rowspan="6" class="hours">Hours</th>
<th>Mon</th>
<th>Tue</th>
<th>Wed</th>
<th>Thu</th>
<th>Fri</th>
</tr>

<!-- First two rows -->
<tr>
<td>Math</td>
<td>Science</td>
<td>Math</td>
<td>Science</td>
<td>Arts</td>
</tr>

<tr>
<td>Math</td>
<td>Science</td>
<td>Math</td>
<td>Science</td>
<td>Arts</td>
</tr>

<!-- Lunch -->
<tr>
<td colspan="5" class="lunch">Lunch</td>
</tr>

<!-- After lunch -->
<tr>
<td>Math</td>
<td>Science</td>
<td>Math</td>
<td rowspan="2" colspan="2" class="project">Project</td>
</tr>

<tr>
<td>Math</td>
<td>Science</td>
<td>Math</td>
</tr>

</table>

</body>
</html>
